notes: LABEL RULE (Item 4(f)) - the bar above each month's Gregorian row is coloured by lunation and a label's text is printed in the coloured segment of the lunation it names; in this edition the animal part of a label is printed in the next month's bar (on the same lunation). Measured on this edition (route B's bar segments against R8's lunations) - 27 of 27 bar segments lie inside one lunation; in 14 of 14 months the bar's colour changes fall exactly on the lunation changes; 14 of 14 labels have their animal part printed on the same lunation as the phrase; no lunation has two labels and none has none (14 lunations; 14 labels); the labels in lunation order follow the seasonal order (13 of 13 neighbouring pairs) and the animals the 12-cycle (13 of 13). So the rule that holds for every label is the printing rule; the candidate rules read from the Gregorian month alone were each tested against all 14 labels - the lunation holding most of the month's days holds for 8 (wrong for 5; undefined for 1); the lunation that begins in the month holds for 12 (wrong for none; undefined for the 2 labels of January 2026 - the first lunation counts as beginning on the first printed day so two lunations begin in that month and the rule names none); the lunation that ends in the month 1; the lunation holding the month's first day 1; the one holding the month's last day 13 (it fails for «Второй зимний месяц» printed in January 2026); the one holding the day with tshes 15 holds for 9 (wrong for 4; undefined for 1). The printed label of each lunation is on its first day in notes (the pieces of a split label are joined by page order and checked by the 12-animal cycle). SEASONAL ORDER (R8) - «Первый весенний» 1; «Второй весенний» 2; «Третий весенний» 3; «Первый летний» 4 to «Третий летний» 6; «Первый осенний» 7 to «Третий осенний» 9; «Первый зимний» 10; «Второй зимний» 11; «Третий зимний» 12. SAGAALGAN CHECK - the text layer has «18 февраля – Сагаалган» (pdftotext -layout line 65) - 2026-02-18 is the first day of the lunation labelled «Первый весенний месяц – белый тигр» (checked by script over the CSV); the line «7 февраля 2027 г. – Сагаалган» (line 110) names the day after this file's last row. F31 - this edition prints no «Дополнительный» label; its 14 lunations are named by the twelve numbered names of the seasonal order. Janson v1 p. 11 (leg 3; FETCHED) - «A leap month takes the same number (and belongs to the same year) as the following month (as in Indian calendars [2]). In a leap year there are thus two months having the same number and; by the rule just given; the first of these is the leap month.» (commas of the quotation written as semicolons) and its footnote 14 says the original system in the Kalacakra Tantra seems the opposite - the leap month taking the number of the preceding month. Nothing is mapped here (the Q1 round maps conventions); the 2025 edition's file records the extra month that edition prints. F30 - the 2025 and 2026 editions print other tshes on 8 days of 2026-01-09 to 2026-01-16 and each file notes the other edition's value; neither is corrected; the other 40 days of 2026-01-01 to 2026-02-17 agree. Every lunation of this edition carries a label - so month is filled on every row and is_leap_month is false on every row. skipped is DERIVED from the neighbouring days (F9 (b)); empty on 2026-01-01 whose predecessor is not in the source; the calendar prints no skip marker; the day-symbol rows are not transcribed. is_doubled is true on the second of two consecutive days with one tshes - 10 doubled days and 16 skipped days. The PDF has a text layer (Creator Adobe InDesign CS4; created 2025-11-26) and is a digital original (not a scan). Discrepancies between the routes: 0.
