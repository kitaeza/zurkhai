method: "Two passes by two routes. First pass: typed by the session from the page as the Read tool renders it (the page image), into raw lines in the order the page prints them, then converted to this CSV by a mechanical awk step (the printed day/month and the year to an ISO date; the name split into element and animal; sorted by year). Second pass: pdftotext -layout of the same PDF into a mktemp -d directory (never in the repository), parsed by a second awk script, then compared with the first pass by diff, cell by cell, not by eye. The second-pass parse takes, for each month row between Table 8's heading and its caption, the run of comma-continued entries after the month number. Result: identical, 23 of 23 events, 0 disagreements. A skipped day is the table's entry marked with a minus sign, a repeated day an unmarked entry. [CORRECTED 2026-11-11 (spec 008 Item 5g, DEBT.md D-15): (1) the first-pass conversion sentence above (the printed day/month and the year to an ISO date; the name split into element and animal; sorted by year) is Table 1's and does not describe this file, whose columns are tibetan_year, month, tshes and kind and which holds no date and no name; what the conversion did beyond writing the printed year, month, number and kind into those columns is not recorded and is not reconstructed here. (2) The second-pass commands were not kept: the parse described above was a scratch script, no script is in the tree, and the second pass cannot be re-run from the tree. The data rows are not in question (RELAYED, the advisor, 2026-11-11: all 195 T5 rows of spec 006 re-measured against the advisor's own pdftotext parse and the T4 fixture; spec 007 Item 0, D-15).]"
