notes: "READINGS: tibetan_year 2012 is the year printed in the caption (each month 2012), read as Janson's Y. It is consistent with Table 9, where all four versions begin 2012 on 22/2 (p. 51: the versions also all start this year on the same day), and with Table 7, which gives 2012 no leap month in any version. kind: repeated is an unmarked entry (one number on two calendar days), skipped a minus-marked entry (a number on no calendar day). The Tsurphu, Mongolia and Bhutan columns are not transcribed. Cross-checked by crates/tshes/tests/p5_reference_tables.rs: 30 x 12 - 14 + 9 = 355 days, equal to the days from Losar 2012 to Losar 2013 by Table 1. Discrepancies between the passes: none."
