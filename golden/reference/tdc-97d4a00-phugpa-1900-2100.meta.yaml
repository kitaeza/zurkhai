covers: "every Gregorian day from 1900-01-01 to 2100-12-31 inclusive: 73,414 rows, contiguous, one row per calendar day. A repeated tshes has two consecutive rows; a skipped tshes has none. No doubled or skipped column: both follow from consecutive rows (FORKS.md F9 is open and not decided here)."
