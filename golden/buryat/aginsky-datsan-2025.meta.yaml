notes: LABEL RULE (Item 4(f)) - the bar above each month's Gregorian row is coloured by lunation and a label's text is printed in the coloured segment of the lunation it names. Measured on this edition (route B's bar segments against R8's lunations) - 26 of 26 bar segments lie inside one lunation; in 14 of 14 months the bar's colour changes fall exactly on the lunation changes; 14 of 14 labels have their animal part printed on the same lunation as the phrase; no lunation has two labels and none has none (14 lunations; 14 labels); the labels in lunation order follow the seasonal order (12 of 12 neighbouring pairs; the extra month skipped) and the animals the 12-cycle (12 of 12). So the rule that holds for every label is the printing rule; the candidate rules read from the Gregorian month alone were each tested against all 14 labels - the lunation holding most of the month's days holds for 12 (it fails for the label «Второй зимний месяц» printed in December 2025 and for «Третий зимний месяц» printed in January 2026 - each sits on the minority lunation of its month); the lunation that begins in the month holds for 2 (undefined for 3); the lunation that ends in the month 12; the lunation holding the month's first day 12; the one holding the month's last day 3; the one holding the day with tshes 15 holds for 11 (undefined for 2). The printed label of each lunation is on its first day in notes (an animal part split across two months' bars is joined; the pairing by page order is checked by the 12-cycle). SEASONAL ORDER (R8) - «Первый весенний» 1; «Второй весенний» 2; «Третий весенний» 3; «Первый летний» 4 to «Третий летний» 6; «Первый осенний» 7 to «Третий осенний» 9; «Первый зимний» 10; «Второй зимний» 11; «Третий зимний» 12. SAGAALGAN CHECK - the text layer has «1 марта – Сагаалган» (pdftotext -layout line 62) - 2025-03-01 is the first day of the lunation labelled «Первый весенний месяц – желтый тигр» (checked by script over the CSV); the line «18 февраля 2026 г. – Сагаа