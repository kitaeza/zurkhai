notes: "REGIME (F14, ruled 2026-11-11, option (a)): generated under the generator's own TZ=UTC pin. FINDING: the library's Gregorian dates depend on the zone it runs in (dist/index.js:344 adds new Date().getTimezoneOffset(), the offset of the zone NOW, in unixFromJulian; the local-time getters of getDateStr, lines 72-77, apply the zone's offset AT THE DATE). Without the pin, under TZ=Pacific/Kiritimati every date 1900-1994 comes out one day early and 1994-12-31 is missing (spec 006 control T-b, re-measured 2026-11-11). CAUSE: NAMED by control T-c: the T-b copy run once under TZ=Etc/GMT-14, a fixed offset of +14 hours with no history, gave stdout byte-identical to this file, so the cause is the change in a zone's offset over time read against today's offset at dist/index.js:344, not the size of the offset. The library's dates are trusted only as generated under TZ=UTC; in a zone whose offset changed by about 12 hours inside 1900-2100 the library gives other dates. YEAR NUMBERING: the library numbers a Tibetan year as the Gregorian year in which it starts plus 127 (dist/index.js:12 YEAR_DIFF = 127, used at lines 284 and 375; Janson v1 p. 8: a year starting in Gregorian year Y is numbered Y + 127 in the epoch-127-BC method), so tibetan_year = the library's year - 127 = Janson's Y (eq. (4.1), p. 8). FIELD MAPPING: gregorian_date = westernDateStr (dist/index.js:777-783, getDateStr 72-77) of the Date unixFromJulian (343-348) makes from the JD that julianFromTibetan (318) gives, JD = floor of Janson's true date, eq. (8.1); tibetan_year = TibetanDate.year (754) - 127; month = TibetanDate.month (755), 1..12; is_leap_month = monthObj.isLeapMonth (756-760, from 419: isLeapMonth && isDoubledMonth), true on the first of two months with one number, as README.md lines 42 and 102 state and as Janson eq. (5.22), p. 17, has it; tshes = TibetanDate.date (753), 1..30. FLAGS (read at dist/index.js:404-426, checked by the generator, not columns): isDoubledDay is true on BOTH days of a repeated number (JD of the day = JD of the previous lunar day + 2), isLeapDay on the FIRST of the two (Janson's leap day, p. 20), isSkippedDay on a number that occupies no day (these are absent from getDays), isPreviousSkipped on the day after a skipped number, and also on the second day of a repeated number that follows a skipped one. The library's isDoubledDay is therefore not 001 5.1's is_doubled (the second occurrence only). The library implements Janson's formulas from epoch year 806 (README.md line 5), as the engine does: agreement between them is one paper implemented twice (METHOD rule 35), not proof that either is right."
