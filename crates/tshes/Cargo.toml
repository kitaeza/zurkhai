# The L1 engine crate (001 §8, 002 §3): the only crate that computes.
# Zero dependencies (002 §4.9); dev-dependencies are allowed.
[package]
name = "tshes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The zurkhai calendar engine (L1): Phugpa Gregorian <-> ZDate, 1900-2100 (spec 005)."

# 002 §8: clippy pedantic at warn, workspace-wide — inherited from the
# workspace root's [workspace.lints.clippy] (members must opt in explicitly).
[lints]
workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
