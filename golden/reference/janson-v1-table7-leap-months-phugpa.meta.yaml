method: "Two passes by two routes. First pass: typed by the session from the page as the Read tool renders it (the page image), into raw lines in the order the page prints them, then converted to this CSV by a mechanical awk step (the printed day/month and the year to an ISO date; the name split into element and animal; sorted by year). Second pass: pdftotext -layout of the same PDF into a mktemp -d directory (never in the repository), parsed by a second awk script, then compared with the first pass by diff, cell by cell, not by eye. The second-pass parse assigns each number to the column whose heading's right edge is nearest to the number's right edge in the pdftotext text. Result: identical, 21 of 21 rows (8 with a leap month), 0 disagreements."
