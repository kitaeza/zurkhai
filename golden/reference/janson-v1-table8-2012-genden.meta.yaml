notes: "The column is headed 'Mongolia' as printed; the project's name for that version is Genden (docs/glossary.md; Janson v1 A.3, p. 41). READINGS: as for the Tsurphu file. It differs from janson-v1-table8-2012-tsurphu.csv in two cells: month 9 repeats day 20 where Tsurphu repeats 19, and month 11 skips day 4 where Tsurphu skips 3. Cross-checked by crates/tshes/tests/p5_versions.rs: 30 x 12 - 13 + 8 = 355 days, equal to the days from Losar 2012 to Losar 2013 by Table 9's Mongolia column. The Phugpa, Tsurphu and Bhutan columns are not in this file. Discrepancies between the passes: none."
