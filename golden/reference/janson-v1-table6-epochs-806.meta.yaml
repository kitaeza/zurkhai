notes: "ENCODING: no field holds a comma, so the radix digits of a value are joined by ':' in their printed order. m0 is printed 'D; d1, d2, d3, d4' with radices (60, 60, 6, 707): D is the first digit, before the semicolon, and is written first (2:22:34:2:518); s0 is printed with radices (27, 60, 60, 6, 67) and a0 with (28, 126), their first digits first. The 'genden' row is the column headed 'Mongolia'. READINGS: the epoch of all four versions is JD 2015531, Monday 23 March 806 (Julian), the mean new moon (p. 50); m0 is given 'in the traditional form modulo 7; to get the result in JD as in this paper, add 2015529' (the Table 6 caption), so m0_decimal is the weekday part plus the fraction, and the JD is 2015529 + m0. The decimals are printed with six decimals (the caption). Discrepancies between the passes: none."
