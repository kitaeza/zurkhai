notes: "READINGS: the text on p. 51 says Table 7 shows leap months for a range of (Gregorian) years. year is read as Janson's Y (the Tibetan year; the Gregorian year in which it starts). Reading it instead as the Gregorian year in which the leap month begins gives the same 21 rows (checked from the T4 fixture, which is independent of the engine, by crates/tshes/tests/p5_reference_tables.rs; the only leap month that could differ is the leap month 11 of 2010, which begins 2010-12-06). The Tsurphu, Mongolia and Bhutan columns are not transcribed. An empty leap_month is the paper's empty cell: the claim is that the Phugpa calendar has no leap month in that year. Discrepancies between the passes: none."
