method: "node v24.14.0 ran tools/t4-tdc.mjs as committed with this file: env TZ=<zone> node tools/t4-tdc.mjs <library directory> > this file. The generator pins its own zone to UTC before it loads the library (F14 (a)), passes the library explicit Tibetan components (year, month, leap flag, day), walks every Tibetan month of the years 1898-2101 through the library's own getMonths and getDays, and cuts the days to 1900-01-01..2100-12-31. It checks the library's own doubled and skipped flags against what consecutive rows imply (0 disagreements) and the zone on every enumerated day, and writes nothing to stdout if any check fails. Three runs, under TZ=UTC, TZ=Pacific/Kiritimati and TZ=Pacific/Pago_Pago, each exit 0, byte-identical, sha256 of this file 8bfd140735bf33b724abe56b0bbb6bb9b63f20164c07cf570622f70f66444ce4. Because of the pin, these runs show that the generator does not depend on the caller's zone; they show nothing about the library."
