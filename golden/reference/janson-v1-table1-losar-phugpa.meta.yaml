notes: "READINGS: gregorian_date is the Gregorian date printed as day/month with the row's year (Janson's Y, the Gregorian year in which the Tibetan year starts, p. 8) as its year. It is the first day of the Tibetan year (Losar) as Janson defines it: the year begins with month 1, and with the leap month when month 1 has one (p. 9; the 2000 row, 2000-02-06, is the first day of leap month 1, footnote 28, p. 28); the first day of the year is 1 plus the JD of the last day of the preceding year (p. 27, the paragraph Tibetan New Year), so it is day 2 when day 1 is skipped. The table prints no gender; the element and animal are split from the printed name (the printed name joins them with an en dash). The Tsurphu, Mongolian and Bhutanese versions have no column in Table 1. Table 1 decides only the first day of a year, nothing else about the year (METHOD rule 25). Checked by crates/tshes/tests/p5_reference_tables.rs. Discrepancies between the passes: none."
